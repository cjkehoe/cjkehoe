<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
<title id="title">Chris Kehoe</title><desc id="desc">I build internet products. Design. Code. Ship. Sell. Mostly private. Always shipping.</desc>
<defs>
  <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#121a2a"/><stop offset=".65" stop-color="#0d1117"/><stop offset="1" stop-color="#101622"/></linearGradient>
  <radialGradient id="glow"><stop stop-color="#818cf8" stop-opacity=".15"/><stop offset="1" stop-color="#818cf8" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#8b949e" stroke-opacity=".045"/></pattern>
  
</defs>
<style>
  text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
  .tag{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:21px;letter-spacing:.2px;fill:#b4bdd0}
  .line{opacity:0;animation:cycle 18s infinite}.second{animation-delay:6s}.third{animation-delay:12s}
  
  @keyframes cycle{0%{opacity:0}3%,30%{opacity:1}33.333%,100%{opacity:0}}
  
  @media(prefers-reduced-motion:reduce){.line{animation:none;opacity:0}.first{opacity:1}}
</style>
<rect x=".5" y=".5" width="1199" height="299" rx="16" fill="url(#bg)" stroke="#252d3b"/>
<rect x="1" y="1" width="1198" height="298" rx="16" fill="url(#grid)"/>
<ellipse cx="995" cy="130" rx="310" ry="210" fill="url(#glow)"/>
<path d="M64 59H110" stroke="#a5b4fc" stroke-width="2"/>
<text x="64" y="157" fill="#f0f3fa" font-size="78" font-weight="750" letter-spacing="-3">CHRIS KEHOE</text>
<g transform="translate(68 216)">
  <text class="tag line first">I build internet products.</text>
  <text class="tag line second">Design. Code. Ship. Sell.</text>
  <text class="tag line third">Mostly private. Always shipping.</text>
</g>
